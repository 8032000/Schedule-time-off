<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PChome 撿出早班班表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        table td, table th { text-align: center; vertical-align: middle; }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <svg class="w-7 h-7 text-indigo-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                    <span class="text-xl font-bold tracking-tight"><span class="text-red-600">PChome</span> <span class="text-slate-900">撿出早班班表</span></span>
                    <span id="cloud-sync-status" class="ml-3 inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-100 text-amber-800 border border-amber-300">
                        <span class="w-2 h-2 rounded-full bg-amber-500 mr-1.5 animate-pulse"></span>🟡 連線嘗試中...
                    </span>
                </div>
                <div class="flex items-center space-x-2 sm:space-x-4">
                    <button onclick="window.switchView('employee')" id="nav-employee" class="px-3 py-2 rounded-md text-sm font-medium transition-colors bg-indigo-50 text-indigo-700">員工劃休區</button>
                    <button onclick="window.switchView('admin')" id="nav-admin" class="px-3 py-2 rounded-md text-sm font-medium transition-colors text-slate-600 hover:bg-slate-100">管理員總表</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-1 w-full max-w-[1400px] mx-auto py-6 px-4 sm:px-6 lg:px-8">
        <div id="employee-view" class="max-w-5xl mx-auto space-y-6">
            <div class="bg-indigo-50 border border-indigo-200 rounded-2xl p-4 text-xs text-indigo-900 space-y-1.5 shadow-sm">
                <div class="flex items-center font-bold text-sm text-indigo-900 mb-1">📢 主管排班公告與排休規範</div>
                <p>⚠️ 排休規則：依勞基法實施「一週一例一休」 | 每週上限 <span class="font-bold text-red-600">2</span> 天 | 最多連上 <span class="font-bold text-red-600">6</span> 天</p>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-6">
                <h2 class="text-base font-bold text-slate-900 flex items-center">👤 排休作業與個人劃休</h2>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">員工編號 (擇一輸入)</label>
                        <input type="text" id="emp-input-id" oninput="window.autoFillEmpName()" placeholder="輸入後自動帶入" class="w-full px-3.5 py-2.5 border rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">員工姓名 (擇一輸入)</label>
                        <input type="text" id="emp-input-name" placeholder="輸入後自動帶入" class="w-full px-3.5 py-2.5 border rounded-xl text-xs bg-slate-50 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">所屬班別 (系統自動帶入)</label>
                        <input type="text" id="emp-input-shift" readonly placeholder="名單設定中自動帶入" class="w-full px-3.5 py-2.5 border rounded-xl text-xs bg-slate-50 text-slate-500 outline-none">
                    </div>
                </div>

                <div class="space-y-3">
                    <h3 class="text-xs font-bold text-slate-700">📅 點擊日曆切換假別</h3>
                    <div id="emp-calendar-grid" class="grid grid-cols-4 sm:grid-cols-7 gap-2"></div>
                </div>

                <div class="flex justify-end">
                    <button onclick="window.submitEmployeeLeave()" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-sm transition-all">
                        💾 儲存排休設定
                    </button>
                </div>
            </div>
        </div>

        <div id="admin-view" class="hidden space-y-6">
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                <h2 class="text-base font-bold text-slate-900">人員排班與各班別人力整合總表</h2>
            </div>
            <div class="bg-white rounded-2xl shadow-sm border overflow-x-auto custom-scrollbar">
                <table class="min-w-full text-xs border-collapse">
                    <thead>
                        <tr id="roster-table-header" class="bg-slate-100 font-bold border-b"></tr>
                    </thead>
                    <tbody id="roster-table-body"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAST35xy8caDPmXU_Y3tKWMY-DSwJ5YPdM",
            authDomain: "schedule-time-off.firebaseapp.com",
            projectId: "schedule-time-off",
            storageBucket: "schedule-time-off.firebasestorage.app",
            messagingSenderId: "343728866805",
            appId: "1:343728866805:web:c2cb0d1b250f30ee6b8cbc"
        };

        async function initCloudSync() {
            const statusEl = document.getElementById('cloud-sync-status');
            try {
                const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApp();
                const db = getFirestore(app);
                
                // 完全合規的 2 段式偶數路徑
                const docRef = doc(db, 'roster_state', 'current');
                
                onSnapshot(docRef, (docSnap) => {
                    if (statusEl) {
                        statusEl.className = "ml-3 inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 border border-emerald-300";
                        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse mr-1.5"></span>🟢 雲端即時連線中`;
                    }
                    if (docSnap.exists() && window.applyStateFromCloud) {
                        window.applyStateFromCloud(docSnap.data());
                    }
                }, (error) => {
                    if (statusEl) {
                        statusEl.className = "ml-3 inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-red-100 text-red-800 border border-red-300";
                        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500 mr-1.5"></span>🔴 雲端連線異常 (${error.code})`;
                    }
                });

                window.cloudSave = async function(data) {
                    try { await setDoc(docRef, data, { merge: true }); } catch (e) {}
                };
            } catch (err) {
                if (statusEl) {
                    statusEl.className = "ml-3 inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-100 text-amber-800 border border-amber-300";
                    statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500 mr-1.5"></span>🟡 本機儲存 (離線模式)`;
                }
            }
        }
        initCloudSync();
    </script>

    <script>
        let state = {
            view: 'employee',
            empList: [
                { id: '802509', name: '邱木樹', shift: '幹部', title: '主管' },
                { id: '10393', name: '張仕育', shift: '早班', title: '組員' }
            ],
            leaves: {},
            currentEmpId: '802509'
        };

        window.switchView = function(view) {
            state.view = view;
            document.getElementById('employee-view').classList.toggle('hidden', view !== 'employee');
            document.getElementById('admin-view').classList.toggle('hidden', view !== 'admin');
            if (view === 'admin') renderRosterTable();
            else renderCalendar();
        };

        window.autoFillEmpName = function() {
            const val = document.getElementById('emp-input-id').value.trim();
            const emp = state.empList.find(e => e.id === val);
            if (emp) {
                document.getElementById('emp-input-name').value = emp.name;
                document.getElementById('emp-input-shift').value = emp.shift;
                state.currentEmpId = emp.id;
                renderCalendar();
            }
        };

        function renderCalendar() {
            const grid = document.getElementById('emp-calendar-grid');
            if (!grid) return;
            grid.innerHTML = '';
            for (let i = 1; i <= 31; i++) {
                const dayStr = i < 10 ? `0${i}` : `${i}`;
                const key = `${state.currentEmpId}_2026-08-${dayStr}`;
                const leaveVal = state.leaves[key] || '';

                const btn = document.createElement('div');
                btn.className = `p-3 border rounded-xl text-center font-bold text-xs cursor-pointer transition-all ${leaveVal ? 'bg-emerald-500 text-white border-emerald-600' : 'bg-white text-slate-700'}`;
                btn.onclick = () => {
                    if (state.leaves[key]) delete state.leaves[key];
                    else state.leaves[key] = '休';
                    renderCalendar();
                };
                btn.innerHTML = `<div>8/${i}</div><div class="text-[10px] mt-1">${leaveVal || '上班'}</div>`;
                grid.appendChild(btn);
            }
        }

        function renderRosterTable() {
            const tbody = document.getElementById('roster-table-body');
            const theadRow = document.getElementById('roster-table-header');
            if (!tbody || !theadRow) return;

            let headerHtml = `<th class="p-2 border-r min-w-[60px]">職稱</th><th class="p-2 border-r min-w-[70px]">員編</th><th class="p-2 border-r min-w-[80px]">姓名</th><th class="p-2 border-r min-w-[60px]">班別</th>`;
            for (let i = 1; i <= 31; i++) headerHtml += `<th class="p-2 border-r min-w-[36px]">8/${i}</th>`;
            theadRow.innerHTML = headerHtml;

            tbody.innerHTML = '';
            state.empList.forEach(emp => {
                const tr = document.createElement('tr');
                tr.className = "border-b hover:bg-slate-50";
                let dateCols = '';
                for (let i = 1; i <= 31; i++) {
                    const dayStr = i < 10 ? `0${i}` : `${i}`;
                    const key = `${emp.id}_2026-08-${dayStr}`;
                    const leaveVal = state.leaves[key] || '';
                    dateCols += `<td class="p-2 border-r font-bold ${leaveVal ? 'bg-emerald-100 text-emerald-800' : ''}">${leaveVal}</td>`;
                }
                tr.innerHTML = `<td class="p-2 border-r text-red-600 font-bold">${emp.title || ''}</td><td class="p-2 border-r font-mono">${emp.id}</td><td class="p-2 border-r font-bold">${emp.name}</td><td class="p-2 border-r">${emp.shift}</td>${dateCols}`;
                tbody.appendChild(tr);
            });
        }

        window.submitEmployeeLeave = function() {
            if (window.cloudSave) window.cloudSave(state);
            alert('已成功儲存劃休資料並同步至 Firebase 雲端！');
        };

        window.applyStateFromCloud = function(cloudData) {
            if (cloudData && cloudData.leaves) {
                state.leaves = cloudData.leaves;
                renderCalendar();
                if (state.view === 'admin') renderRosterTable();
            }
        };

        document.addEventListener('DOMContentLoaded', () => { renderCalendar(); });
    </script>
</body>
</html>
