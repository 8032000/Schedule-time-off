<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">

<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Main Workspace Container -->
    <main class="flex-1 w-full max-w-[1400px] mx-auto py-6 px-4 sm:px-6 lg:px-8">

                            <h3 class="text-sm font-bold text-indigo-900 mb-1">主管排班公告</h3>

                        <div>

                    <!-- Date Selection Inputs -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8 p-4 bg-slate-50 border border-slate-200 rounded-xl shadow-inner">

                            </label>
                            <input type="text" id="emp-rest-input" onblur="window.handleTypedDates()" placeholder="例如: 5, 12" class="w-full text-sm rounded-lg border-emerald-300 border px-3 py-2 focus:ring-2 focus:ring-emerald-500 outline-none font-medium text-emerald-900 bg-white shadow-sm">
                        </div>
                        <div>

                                <span id="count-reg" class="text-xs bg-blue-100 px-1.5 py-0.5 rounded text-blue-800">已排 0</span>
                            </label>
                            <input type="text" id="emp-regular-input" onblur="window.handleTypedDates()" placeholder="例如: 6, 13" class="w-full text-sm rounded-lg border-blue-300 border px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none font-medium text-blue-900 bg-white shadow-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-rose-700 mb-1 flex items-center justify-between">

                                <span id="count-nat" class="text-xs bg-rose-100 px-1.5 py-0.5 rounded text-rose-800">已排 0</span>
                            </label>
                            <input type="text" id="emp-national-input" onblur="window.handleTypedDates()" placeholder="例如: 10" class="w-full text-sm rounded-lg border-rose-300 border px-3 py-2 focus:ring-2 focus:ring-rose-500 outline-none font-medium text-rose-900 bg-white shadow-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-amber-700 mb-1 flex items-center justify-between">
                                <span class="flex items-center"><span class="w-3 h-3 rounded-full bg-amber-500 mr-1.5"></span> 年假/特休 (年)</span>
                                <span id="count-ann" class="text-xs bg-amber-100 px-1.5 py-0.5 rounded text-amber-800">已排 0</span>
                            </label>
                            <input type="text" id="emp-annual-input" onblur="window.handleTypedDates()" placeholder="例如: 22" class="w-full text-sm rounded-lg border-amber-300 border px-3 py-2 focus:ring-2 focus:ring-amber-500 outline-none font-medium text-amber-900 bg-white shadow-sm">
                        </div>
                    </div>

                    <!-- Calendar Grid -->
                    <div class="mb-6">
                        <h3 class="text-md font-semibold text-slate-800 mb-4" id="calendar-title">可排休日期（點擊按鈕劃休）</h3>
                        <div id="calendar-grid" class="grid grid-cols-4 sm:grid-cols-7 gap-3"></div>
                    </div>

                    <!-- Remark -->
                    <div class="mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <label class="block text-sm font-bold text-slate-700 mb-1">排休備註說明 (選填)</label>
                        <textarea id="emp-remark" rows="2" class="w-full rounded-lg border-slate-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white" placeholder="填寫備註說明..."></textarea>
                    </div>

                    <div class="flex flex-col sm:flex-row justify-between items-center pt-4 border-t border-slate-100 gap-3">

                        </label>
                        <button onclick="window.submitEmployeeLeave()" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-lg shadow-sm">
                            儲存排休設定

                    </div>

            </div>
        </div>

        <!-- Admin View -->
        <div id="admin-view" class="hidden space-y-6">
            <!-- 9 Subnav Tabs -->
            <div class="flex justify-center mb-4">
                <div class="bg-slate-100 p-1.5 rounded-full inline-flex flex-wrap shadow-inner w-full max-w-[1350px] gap-1">
                    <button id="subnav-leaves" onclick="window.switchAdminSubView('leaves')" class="flex-1 py-2 px-3 rounded-full text-xs font-bold bg-indigo-600 text-white">👤 人員與人力整合主控表</button>
                    <button id="subnav-qrcode" onclick="window.switchAdminSubView('qrcode')" class="flex-1 py-2 px-3 rounded-full text-xs font-bold bg-slate-100 text-slate-500">📱 掃碼排假/網址</button>
                    <button id="subnav-manpower" onclick="window.switchAdminSubView('manpower')" class="flex-1 py-2 px-3 rounded-full text-xs font-bold bg-slate-100 text-slate-500">⚙️ 變形工時與規則設定</button>
                    <button id="subnav-special" onclick="window.switchAdminSubView('special')" class="flex-1 py-2 px-3 rounded-full text-xs font-bold bg-slate-100 text-slate-500">⭐ 特殊崗位</button>
                    <button id="subnav-roles" onclick="window.switchAdminSubView('roles')" class="flex-1 py-2 px-3 rounded-full text-xs font-bold bg-slate-100 text-slate-500">🎲 主管輪值</button>
                    <button id="subnav-query" onclick="window.switchAdminSubView('query')" class="flex-1 py-2 px-3 rounded-full text-xs font-bold bg-slate-100 text-slate-500">🔍 貼上姓名帶出假別</button>
                    <button id="subnav-logs" onclick="window.switchAdminSubView('logs')" class="flex-1 py-2 px-3 rounded-full text-xs font-bold bg-slate-100 text-slate-500">📋 異動紀錄</button>
                    <button id="subnav-settings" onclick="window.switchAdminSubView('settings')" class="flex-1 py-2 px-3 rounded-full text-xs font-bold bg-slate-100 text-slate-500">📝 公告/名單設定</button>
                    <button id="subnav-feiteng" onclick="window.switchAdminSubView('feiteng')" class="flex-1 py-2 px-3 rounded-full text-xs font-bold bg-slate-100 text-slate-500">☁️ 飛騰匯出</button>
                </div>
            </div>

            <!-- Subview Master Table -->
            <div id="admin-subview-leaves" class="bg-white shadow-sm rounded-xl border border-slate-200 overflow-hidden flex flex-col h-[700px]">
                <div class="px-6 py-4 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center shrink-0">
                    <h2 class="text-lg font-bold text-slate-800">人員排班與各班別人力整合總表</h2>
                    <button onclick="window.exportLeavesToCSV()" class="px-3 py-2 bg-blue-600 text-white font-bold text-xs rounded-lg">匯出 CSV</button>
                </div>
                <div class="overflow-auto custom-scrollbar flex-1 bg-white p-2">
                    <table class="min-w-full border-collapse w-max table-fixed">
                        <thead id="admin-leaves-thead"></thead>
                        <tbody id="admin-leaves-tbody" class="text-sm"></tbody>
                    </table>
                </div>
            </div>

            <div id="admin-subview-qrcode" class="hidden bg-white p-6 rounded-xl border space-y-4">
                <h2 class="text-lg font-bold">📱 掃碼排假網址分享</h2>
                <input type="text" id="share-url-input" class="w-full border p-2 text-xs font-mono rounded">
            </div>

            <div id="admin-subview-manpower" class="hidden bg-white p-6 rounded-xl border space-y-4">
                <h2 class="text-lg font-bold">⚙️ 變形工時與規則</h2>
            </div>
            <div id="admin-subview-special" class="hidden bg-white p-6 rounded-xl border space-y-4">
                <h2 class="text-lg font-bold">⭐ 特殊崗位</h2>
            </div>
            <div id="admin-subview-roles" class="hidden bg-white p-6 rounded-xl border space-y-4">
                <h2 class="text-lg font-bold">🎲 主管輪值</h2>
            </div>
            <div id="admin-subview-query" class="hidden bg-white p-6 rounded-xl border space-y-4">
                <h2 class="text-lg font-bold">🔍 貼上姓名帶出假別</h2>
                <textarea id="batch-query-input" rows="4" class="w-full border p-2 text-xs rounded"></textarea>
            </div>
            <div id="admin-subview-logs" class="hidden bg-white p-6 rounded-xl border space-y-4">
                <h2 class="text-lg font-bold">📋 異動紀錄</h2>
            </div>
            <div id="admin-subview-settings" class="hidden bg-white p-6 rounded-xl border space-y-4">
                <h2 class="text-lg font-bold">📝 公告與名單設定</h2>
            </div>
            <div id="admin-subview-feiteng" class="hidden bg-white p-6 rounded-xl border space-y-4">
                <h2 class="text-lg font-bold">☁️ 飛騰匯出</h2>
                <button onclick="window.exportFeitengCSV()" class="px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded">下載飛騰檔 CSV</button>
            </div>
        </div>
    </main>

    <!-- Clean Direct Connection Firebase Module (NO Auth 400, Fixed EVEN Path) -->
    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js?v=20260809";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js?v=20260809";

        const firebaseConfig = {
            apiKey: "AIzaSyAST35xy8caDPmXU_Y3tKWMY-DSwJ5YPdM",
            authDomain: "schedule-time-off.firebaseapp.com",
            projectId: "schedule-time-off",
            storageBucket: "schedule-time-off.firebasestorage.app",
            messagingSenderId: "343728866805",
            appId: "1:343728866805:web:c2cb0d1b250f30ee6b8cbc"
        };

        let db = null;

        async function initCloudSync() {
            const statusEl = document.getElementById('cloud-sync-status');

            try {
                const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApp();
                db = getFirestore(app);

                // STRICTLY EVEN 2-SEGMENT PATH: roster_state/current
                const docRef = doc(db, 'roster_state', 'current');
                
                onSnapshot(docRef, (docSnap) => {
                    if (statusEl) {
                        statusEl.className = "ml-3 inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 border border-emerald-300";
                        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse mr-1.5"></span>🟢 雲端即時連線中`;
                    }
                    if (docSnap.exists() && window.applyStateFromCloud) {
                        window.applyStateFromCloud(docSnap.data());
                    }
                }, (error) => {
                    console.error("Firestore Listen Notice:", error);
                    let errTip = "連線受阻";
                    if (error.code === 'permission-denied') errTip = "Rules 未開放";

                    if (statusEl) {
                        statusEl.className = "ml-3 inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-red-100 text-red-800 border border-red-300";
                        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500 mr-1.5"></span>🔴 雲端連線異常 (${errTip})`;
                    }
                });

                window.cloudSave = async function(data) {
                    if (!db) return;
                    try { await setDoc(docRef, data, { merge: true }); } catch (e) { console.error("Cloud Save Failed:", e); }
                };

            } catch (err) {
                console.error("Initialization Fail:", err);
                if (statusEl) {
                    statusEl.className = "ml-3 inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-100 text-amber-800 border border-amber-300";
                    statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500 mr-1.5"></span>🟡 本機儲存 (離線模式)`;
                }
            }
        }

        initCloudSync();
    </script>

    <!-- Complete App Business Engine -->
    <script>
        const today = new Date();
        const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
        const lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0);
        
        const formatDate = (date) => {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };

        const state = {
            view: 'employee',
            adminSubView: 'leaves',
            leaves: [],
            empList: [
                { title: '主管', id: '802509', name: '邱木樹', shift: '幹部' },
                { title: '組員', id: '10393', name: '張仕育', shift: '早班' }
            ],
            currentEmpId: '',
            currentEmpName: '',
            currentRestDates: [],
            currentRegularDates: [],
            currentNationalDates: [],
            currentAnnualDates: [],
            currentStartDate: formatDate(firstDay),
            currentEndDate: formatDate(lastDay),
            rules: { maxPerWeek: 2, monthRest: 8, monthReg: 4, monthNat: 0, maxConsecutiveWorkDays: 6 }
        };

        window.applyStateFromCloud = function(cloudData) {
            if (cloudData.leaves) state.leaves = cloudData.leaves;
            if (cloudData.empList) state.empList = cloudData.empList;
            if (cloudData.rules) state.rules = cloudData.rules;

            window.renderAnnouncement();
            if (state.view === 'employee') {
                renderCalendar();
            } else {
                window.switchAdminSubView(state.adminSubView);
            }
        };

        window.getDatesInRange = function(startStr, endStr) {
            const dateArray = [];
            const sParts = startStr.split('-');
            const eParts = endStr.split('-');
            let currentDate = new Date(parseInt(sParts[0],10), parseInt(sParts[1],10)-1, parseInt(sParts[2],10));
            const end = new Date(parseInt(eParts[0],10), parseInt(eParts[1],10)-1, parseInt(eParts[2],10));
            while (currentDate <= end) {
                dateArray.push(formatDate(currentDate));
                currentDate.setDate(currentDate.getDate() + 1);
            }
            return dateArray;
        };

        window.renderAnnouncement = function() {
            const textElement = document.getElementById('announcement-text');
            if(textElement) {
                textElement.innerHTML = `⚠️ <b>排休規則：</b> 依勞基法實施<b>「一週一例一休」</b> | 每週上限 <span class="text-rose-600 font-bold">${state.rules.maxPerWeek}</span> 天 | 最多連上 <span class="text-rose-600 font-bold">${state.rules.maxConsecutiveWorkDays || 6}</span> 天`;
            }
        };

        window.switchView = function(viewName) {
            state.view = viewName;
            document.getElementById('employee-view').classList.toggle('hidden', viewName !== 'employee');
            document.getElementById('admin-view').classList.toggle('hidden', viewName !== 'admin');
            if (viewName === 'employee') {
                window.renderAnnouncement(); renderCalendar();
            } else {
                window.switchAdminSubView(state.adminSubView);
            }
        };

        window.switchAdminSubView = function(subView) {
            state.adminSubView = subView;
            ['leaves', 'qrcode', 'manpower', 'special', 'roles', 'query', 'logs', 'settings', 'feiteng'].forEach(v => {
                const el = document.getElementById(`admin-subview-${v}`);
                if (el) el.classList.add('hidden');
                const btn = document.getElementById(`subnav-${v}`);
                if (btn) btn.className = "flex-1 py-2 px-3 rounded-full text-xs font-bold bg-slate-100 text-slate-500 hover:bg-slate-200 transition-colors text-center whitespace-nowrap";
            });
            const targetView = document.getElementById(`admin-subview-${subView}`);
            if (targetView) targetView.classList.remove('hidden');
            const targetBtn = document.getElementById(`subnav-${subView}`);
            if (targetBtn) targetBtn.className = "flex-1 py-2 px-3 rounded-full text-xs font-bold bg-indigo-600 text-white shadow-md transition-colors text-center whitespace-nowrap";

            if (subView === 'leaves') window.renderAdminLeaves();
        };

        window.clearOther = function(type) {
            if (type === 'id') document.getElementById('emp-name').value = '';
            else document.getElementById('emp-id').value = '';
            document.getElementById('emp-shift').value = '';
            state.currentEmpId = '';
            state.currentRestDates = []; state.currentRegularDates = []; state.currentNationalDates = []; state.currentAnnualDates = [];
            window.syncDatesToInputs(); renderCalendar();
        };

        window.handleEmpBlur = function(type) {
            const query = type === 'id' ? document.getElementById('emp-id').value.trim() : document.getElementById('emp-name').value.trim();
            if (!query) return;
            const emp = state.empList.find(e => type === 'id' ? e.id === query : e.name === query);
            if (emp) {
                document.getElementById('emp-id').value = emp.id;
                document.getElementById('emp-name').value = emp.name;
                document.getElementById('emp-shift').value = emp.shift;
                state.currentEmpId = emp.id; state.currentEmpName = emp.name;
                
                const existingLeave = state.leaves.find(l => l.empId === emp.id);
                if (existingLeave) {
                    state.currentRestDates = [...(existingLeave.restDates || [])];
                    state.currentRegularDates = [...(existingLeave.regularDates || [])];
                    state.currentNationalDates = [...(existingLeave.nationalDates || [])];
                    state.currentAnnualDates = [...(existingLeave.annualDates || [])];
                }
                window.syncDatesToInputs(); renderCalendar();
            }
        };

        window.syncDatesToInputs = function() {
            const validDates = window.getDatesInRange(state.currentStartDate, state.currentEndDate);
            const formatForInput = (dates) => dates.filter(d => validDates.includes(d)).map(dStr => `${parseInt(dStr.split('-')[1], 10)}/${parseInt(dStr.split('-')[2], 10)}`).join(', ');
            
            document.getElementById('emp-rest-input').value = formatForInput(state.currentRestDates);
            document.getElementById('emp-regular-input').value = formatForInput(state.currentRegularDates);
            document.getElementById('emp-national-input').value = formatForInput(state.currentNationalDates);
            document.getElementById('emp-annual-input').value = formatForInput(state.currentAnnualDates);

            document.getElementById('count-rest').innerText = `已排 ${state.currentRestDates.length}`;
            document.getElementById('count-reg').innerText = `已排 ${state.currentRegularDates.length}`;
            document.getElementById('count-nat').innerText = `已排 ${state.currentNationalDates.length}`;
            document.getElementById('count-ann').innerText = `已排 ${state.currentAnnualDates.length}`;
        };

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            if(!grid) return; grid.innerHTML = '';
            const dates = window.getDatesInRange(state.currentStartDate, state.currentEndDate);
            const dayNames = ['日', '一', '二', '三', '四', '五', '六'];

            dates.forEach(dateStr => {
                const parts = dateStr.split('-');
                const d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
                
                const isRest = state.currentRestDates.includes(dateStr);
                const isReg = state.currentRegularDates.includes(dateStr);
                const isNat = state.currentNationalDates.includes(dateStr);
                const isAnn = state.currentAnnualDates.includes(dateStr);

                const btn = document.createElement('button');
                btn.className = `flex flex-col items-center justify-center p-2 sm:p-3 rounded-xl border-2 transition-all ${
                    isRest ? 'border-emerald-500 bg-emerald-50 text-emerald-700 font-bold' :
                    isReg ? 'border-blue-500 bg-blue-50 text-blue-700 font-bold' :
                    isNat ? 'border-rose-500 bg-rose-50 text-rose-700 font-bold' :
                    isAnn ? 'border-amber-500 bg-amber-50 text-amber-900 font-bold' :
                    'border-slate-200 bg-white hover:border-indigo-300 text-slate-700'
                }`;
                btn.innerHTML = `
                    <span class="text-xs font-bold text-slate-500">${parts[1]}/${parts[2]}</span>
                    <span class="text-lg font-extrabold mt-0.5">${dayNames[d.getDay()]}</span>
                `;
                btn.onclick = () => window.toggleDate(dateStr);
                grid.appendChild(btn);
            });
        }

        window.toggleDate = function(dateStr) {
            if (!state.currentEmpId) { alert('請先輸入並帶入員工資料'); return; }
            const idx = state.currentRestDates.indexOf(dateStr);
            if (idx > -1) state.currentRestDates.splice(idx, 1);
            else state.currentRestDates.push(dateStr);
            window.syncDatesToInputs(); renderCalendar();
        };

        window.submitEmployeeLeave = function() {
            if (!state.currentEmpId) { alert('請先完成員工識別'); return; }
            
            let leaveRecord = state.leaves.find(l => l.empId === state.currentEmpId);
            if (!leaveRecord) {
                leaveRecord = { empId: state.currentEmpId, name: state.currentEmpName, shift: document.getElementById('emp-shift').value };
                state.leaves.push(leaveRecord);
            }
            leaveRecord.restDates = [...state.currentRestDates];
            leaveRecord.regularDates = [...state.currentRegularDates];
            leaveRecord.nationalDates = [...state.currentNationalDates];
            leaveRecord.annualDates = [...state.currentAnnualDates];

            window.saveLocal();
            alert('已成功儲存劃休設定並同步雲端！');
        };

        window.saveLocal = function() {
            const dataToSave = { leaves: state.leaves, empList: state.empList, rules: state.rules };
            localStorage.setItem('MonthlyRosterSystemData', JSON.stringify(dataToSave));
            if (typeof window.cloudSave === 'function') {
                window.cloudSave(dataToSave);
            }
        };

        window.renderAdminLeaves = function() {
            const thead = document.getElementById('admin-leaves-thead');
            const tbody = document.getElementById('admin-leaves-tbody');
            if(!thead || !tbody) return;

            const dates = window.getDatesInRange(state.currentStartDate, state.currentEndDate);
            const dayNames = ['日', '一', '二', '三', '四', '五', '六'];

            let dateRow = `<tr>
                <th class="p-2 border font-bold min-w-[50px]">職稱</th>
                <th class="p-2 border font-bold min-w-[60px]">員編</th>
                <th class="p-2 border font-bold min-w-[70px]">姓名</th>
                <th class="p-2 border font-bold min-w-[60px]">班別</th>
                <th class="p-2 border font-bold min-w-[90px]">劃休天數</th>
            `;
            dates.forEach(d => {
                const parts = d.split('-');
                const dObj = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
                dateRow += `<th class="p-1 border w-[38px] text-center text-xs bg-slate-100">${parts[2]}<br>${dayNames[dObj.getDay()]}</th>`;
            });
            dateRow += `</tr>`;
            thead.innerHTML = dateRow;

            let tbodyHtml = '';
            state.empList.forEach(emp => {
                const l = state.leaves.find(leave => leave.empId === emp.id) || { restDates: [], regularDates: [], nationalDates: [], annualDates: [] };
                tbodyHtml += `<tr class="hover:bg-amber-50 text-center">
                    <td class="p-1 border text-rose-700 font-bold">${emp.title || ''}</td>
                    <td class="p-1 border font-mono">${emp.id}</td>
                    <td class="p-1 border font-bold text-blue-700">${emp.name}</td>
                    <td class="p-1 border">${emp.shift}</td>
                    <td class="p-1 border font-bold text-purple-900">${(l.restDates||[]).length} 天</td>
                `;

                dates.forEach(dateStr => {
                    let content = '';
                    if ((l.restDates||[]).includes(dateStr)) content = `<span class="text-emerald-600 font-extrabold">休</span>`;
                    else if ((l.regularDates||[]).includes(dateStr)) content = `<span class="text-blue-600 font-extrabold">例</span>`;
                    tbodyHtml += `<td class="p-1 border">${content}</td>`;
                });
                tbodyHtml += `</tr>`;
            });
            tbody.innerHTML = tbodyHtml;
        };

        window.exportLeavesToCSV = function() {
            let csv = '\uFEFF員編,姓名,班別,日期,假別\n';
            state.empList.forEach(emp => {
                const l = state.leaves.find(leave => leave.empId === emp.id) || { restDates: [] };
                const dates = window.getDatesInRange(state.currentStartDate, state.currentEndDate);
                dates.forEach(dStr => {
                    const isOff = (l.restDates||[]).includes(dStr);
                    csv += `${emp.id},${emp.name},${emp.shift},${dStr},${isOff ? '休假' : '上班'}\n`;
                });
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `PChome_Roster_Master.csv`;
            a.click();
            URL.revokeObjectURL(url);
        };

        document.addEventListener('DOMContentLoaded', () => {
            window.renderAnnouncement();
            renderCalendar();
            const shareInput = document.getElementById('share-url-input');
            if (shareInput) shareInput.value = window.location.href;
        });
    </script>
</body>
</html>
